<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo · Loja AHBVV</title>
  </head>
  <body>
    <header class="top">
      <p class="eyebrow">Bombeiros Voluntários de Valadares · Loja</p>
      <h1>Catálogo</h1>
    </header>

    <main>
      <div class="controls">
        <label class="field field-search">
          <span>Pesquisar</span>
          <input id="q" type="search" placeholder="nome ou tag — ex.: miniatura metal" autocomplete="off" />
        </label>
        <label class="field">
          <span>Categoria</span>
          <select id="category"></select>
        </label>
        <button id="sort" type="button" class="sort"></button>
      </div>

      <div id="status" aria-live="polite"></div>

      <div class="panes">
        <ul id="list" class="list"></ul>
        <section id="detail" class="detail" aria-live="polite"></section>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
